<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A* 柏林噪声地形寻路</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-layout">
        
        <!-- 左侧侧边栏 -->
        <aside class="sidebar">
            <div class="brand">
                <h1>NEON<br>TERRAIN</h1>
                <span class="version">v7.0 Ultra</span>
            </div>

            <!-- 地形笔刷 -->
            <div class="tool-panel">
                <h3>🎨 地形笔刷 (含权重)</h3>
                <div class="brush-grid">
                    <button class="brush-btn active" onclick="setTool('wall')" data-tool="wall">
                        <div class="color-box wall"></div> 墙壁 <span class="cost">⛔</span>
                    </button>
                    <button class="brush-btn" onclick="setTool('forest')" data-tool="forest">
                        <div class="color-box forest"></div> 林地 <span class="cost">3</span>
                    </button>
                    <button class="brush-btn" onclick="setTool('swamp')" data-tool="swamp">
                        <div class="color-box swamp"></div> 沼泽 <span class="cost">5</span>
                    </button>
                    <button class="brush-btn" onclick="setTool('water')" data-tool="water">
                        <div class="color-box water"></div> 水域 <span class="cost">10</span>
                    </button>
                    <button class="brush-btn" onclick="setTool('mountain')" data-tool="mountain">
                        <div class="color-box mountain"></div> 山地 <span class="cost">20</span>
                    </button>
                    <button class="brush-btn" onclick="setTool('lava')" data-tool="lava">
                        <div class="color-box lava"></div> 岩浆 <span class="cost">50</span>
                    </button>
                    <button class="brush-btn eraser" onclick="setTool('empty')" data-tool="empty">
                        <div class="color-box empty"></div> 平地/橡皮擦 <span class="cost">1</span>
                    </button>
                </div>
            </div>

            <!-- 算法介绍 -->
            <div class="algo-info-panel">
                <h2 id="algo-title">算法名称</h2>
                <p id="algo-desc">算法描述...</p>
                <div class="algo-tags" id="algo-tags"></div>
            </div>

            <div class="footer-note">
                Ctrl+左键: 移动起点 | Ctrl+右键: 移动终点
            </div>
        </aside>

        <!-- 右侧游戏区 -->
        <main class="game-area">
            <!-- 仪表盘 -->
            <div class="dashboard">
                <div class="stat-card">
                    <span class="stat-label">⏱ 耗时</span>
                    <span id="stat-time" class="stat-value">0.00</span><span class="stat-unit">ms</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">👣 步数</span>
                    <span id="stat-length" class="stat-value">0</span><span class="stat-unit">格</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">💎 总代价</span>
                    <span id="stat-cost" class="stat-value">0</span><span class="stat-unit">点</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">🔍 搜索</span>
                    <span id="stat-visited" class="stat-value">0</span><span class="stat-unit">个</span>
                </div>
            </div>

            <!-- 控制面板 -->
			<div class="controls">
				<div class="input-group">
					<label>行</label><input type="number" id="row-input" value="21" min="5" max="61"> <!-- 迷宫算法建议使用奇数行列 -->
					<label>列</label><input type="number" id="col-input" value="31" min="5" max="61">
					<button class="btn-apply" onclick="applySize()">重置</button>
				</div>

				<!-- 寻路算法选择 -->
				<select id="algo-select" onchange="updateAlgoDescription()">
					<option value="astar">A* (智能权重)</option>
					<option value="dijkstra">Dijkstra (最优权重)</option>
					<option value="bfs">BFS (仅看步数)</option>
					<option value="dfs">DFS (随机乱走)</option>
					<option value="greedy">贪婪 (短视权重)</option>
				</select>
				
				<!-- 分隔符 -->
				<div style="width:1px; height:25px; background:rgba(255,255,255,0.1); margin:0 5px;"></div>

				<!-- 地图生成器选择 (整合与新增) -->
				<div class="generator-group" style="display:flex; gap:5px;">
					<select id="maze-select" style="background:#1e1b4b; border-color:#4f46e5;">
						<option value="perlin">🌍 柏林噪声地形</option>
						<option value="random">🎲 随机散落墙壁</option>
						<option value="recursive">💠 递归分割迷宫 (分形)</option>
						<option value="backtracker">🐍 DFS 回溯迷宫 (蜿蜒)</option>
					</select>
					<button class="btn-action" onclick="generateMapHandler()">生成地图</button>
				</div>
				
				<!-- 操作按钮 -->
				<button class="btn-start" onclick="startSearch()">▶ 开始寻路</button>
				<button class="btn-danger" onclick="resetAllWithAnimation()">🗑 全局清空</button>
			</div>

            <div id="grid-container"></div>
        </main>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
